<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <style>
      .box { fill: #f7f9fc; stroke: #333333; stroke-width: 1.4; }
      .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: #1f1f1f; }
      .iface-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: bold; font-style: italic; text-anchor: middle; fill: #1f1f1f; }
      .member { font-family: "Consolas", "Courier New", monospace; font-size: 13px; fill: #222222; }
      .sep { stroke: #333333; stroke-width: 1.1; }
      .rel { stroke: #333333; stroke-width: 1.3; stroke-dasharray: 7 5; fill: none; }
      .assoc { stroke: #333333; stroke-width: 1.3; fill: none; }
      .mult { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #333333; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>

  <!-- Interface Movable -->
  <rect class="box" x="440" y="40" width="320" height="170" rx="3"/>
  <line class="sep" x1="440" y1="80" x2="760" y2="80"/>
  <text class="iface-title" x="600" y="66">«interface» Movable</text>
  <text class="member" x="452" y="105">+moveUp(): void</text>
  <text class="member" x="452" y="133">+moveDown(): void</text>
  <text class="member" x="452" y="161">+moveLeft(): void</text>
  <text class="member" x="452" y="189">+moveRight(): void</text>

  <!-- MovablePoint -->
  <rect class="box" x="40" y="360" width="340" height="350" rx="3"/>
  <line class="sep" x1="40" y1="398" x2="380" y2="398"/>
  <text class="title" x="210" y="384">MovablePoint</text>
  <text class="member" x="52" y="423">-x: int</text>
  <text class="member" x="52" y="448">-y: int</text>
  <text class="member" x="52" y="473">-xSpeed: int</text>
  <text class="member" x="52" y="498">-ySpeed: int</text>
  <line class="sep" x1="40" y1="515" x2="380" y2="515"/>
  <text class="member" x="52" y="540">+MovablePoint(x: int, y: int,</text>
  <text class="member" x="52" y="560">  xSpeed: int, ySpeed: int)</text>
  <text class="member" x="52" y="585">+moveUp(): void</text>
  <text class="member" x="52" y="610">+moveDown(): void</text>
  <text class="member" x="52" y="635">+moveLeft(): void</text>
  <text class="member" x="52" y="660">+moveRight(): void</text>
  <text class="member" x="52" y="685">+toString(): String</text>

  <!-- MovableCircle -->
  <rect class="box" x="430" y="360" width="340" height="320" rx="3"/>
  <line class="sep" x1="430" y1="398" x2="770" y2="398"/>
  <text class="title" x="600" y="384">MovableCircle</text>
  <text class="member" x="442" y="423">-radius: int</text>
  <text class="member" x="442" y="448">-center: MovablePoint</text>
  <line class="sep" x1="430" y1="465" x2="770" y2="465"/>
  <text class="member" x="442" y="490">+MovableCircle(x: int, y: int,</text>
  <text class="member" x="442" y="510">  xSpeed: int, ySpeed: int,</text>
  <text class="member" x="442" y="530">  radius: int)</text>
  <text class="member" x="442" y="555">+toString(): String</text>
  <text class="member" x="442" y="580">+moveUp(): void</text>
  <text class="member" x="442" y="605">+moveDown(): void</text>
  <text class="member" x="442" y="630">+moveLeft(): void</text>
  <text class="member" x="442" y="655">+moveRight(): void</text>

  <!-- MovableRectangle -->
  <rect class="box" x="830" y="360" width="330" height="340" rx="3"/>
  <line class="sep" x1="830" y1="398" x2="1160" y2="398"/>
  <text class="title" x="995" y="384">MovableRectangle</text>
  <text class="member" x="842" y="423">-topLeft: MovablePoint</text>
  <text class="member" x="842" y="448">-bottomRight: MovablePoint</text>
  <line class="sep" x1="830" y1="465" x2="1160" y2="465"/>
  <text class="member" x="842" y="490">+MovableRectangle(x1: int,</text>
  <text class="member" x="842" y="510">  y1: int, x2: int, y2: int,</text>
  <text class="member" x="842" y="530">  xSpeed: int, ySpeed: int)</text>
  <text class="member" x="842" y="555">+speedTest(): boolean</text>
  <text class="member" x="842" y="580">+moveUp(): void</text>
  <text class="member" x="842" y="605">+moveDown(): void</text>
  <text class="member" x="842" y="630">+moveLeft(): void</text>
  <text class="member" x="842" y="655">+moveRight(): void</text>
  <text class="member" x="842" y="680">+toString(): String</text>

  <!-- Realization: MovablePoint -> Movable -->
  <polyline class="rel" points="210,360 210,250 520,250 520,230"/>
  <polygon points="520,210 510,230 530,230" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>

  <!-- Realization: MovableCircle -> Movable -->
  <polyline class="rel" points="600,360 600,230"/>
  <polygon points="600,210 590,230 610,230" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>

  <!-- Realization: MovableRectangle -> Movable -->
  <polyline class="rel" points="995,360 995,270 680,270 680,230"/>
  <polygon points="680,210 670,230 690,230" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>

  <!-- Composition of MovableCircle and one MovablePoint -->
  <polygon points="430,520 420,514 410,520 420,526" fill="#333333" stroke="#333333" stroke-width="1"/>
  <line class="assoc" x1="410" y1="520" x2="380" y2="520"/>
  <text class="mult" x="392" y="512">1</text>

  <!-- Composition of MovableRectangle and two MovablePoints -->
  <polygon points="995,700 989,710 995,720 1001,710" fill="#333333" stroke="#333333" stroke-width="1"/>
  <polyline class="assoc" points="995,720 995,780 210,780 210,710"/>
  <text class="mult" x="1007" y="742">2</text>
</svg>
